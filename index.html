<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NUSIMAK — Nurul Ulum Sistem Monitoring Asrama & Kegiatan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            langit: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              200: '#bae6fd',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e'
            },
            kitab: {
              100: '#fef9c3',
              300: '#fde047',
              400: '#facc15',
              500: '#eab308',
              600: '#ca8a04'
            }
          }
        }
      }
    };
  </script>
  <style>
    @media print {
      .no-print { display: none !important; }
      body { background: #ffffff !important; }
      .print-break { break-inside: avoid; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen antialiased">
  <div id="root"></div>

  <script>
    (function () {
      const e = React.createElement;
      const { useState, useEffect, useMemo } = React;

      const STORAGE_KEY = 'nusimak_nurul_ulum_bantul_v1';

      const BAGIAN_LIST = [
        { id: 'dewan_pengasuh', nama: 'Dewan Pengasuh', peran: 'Arahan, pembinaan ruhiyah, kebijakan umum & evaluasi strategis' },
        { id: 'dewan_pengawas', nama: 'Dewan Pengawas', peran: 'Kontrol tata tertib, kepatuhan aturan & audit kepengurusan' },
        { id: 'ustadz_ustadzah', nama: 'Ustadz & Ustadzah', peran: 'Pengajaran kitab, tahfidz/ngaji, adab & pendampingan santri' },
        { id: 'osim', nama: 'OSIM', peran: 'Penggerak kegiatan harian, kedisiplinan & program santri' },
        { id: 'komplek_zainuri', nama: 'Komplek Mbah Zainuri', peran: 'Pengelolaan kamar, kebersihan & ketertiban asrama' },
        { id: 'komplek_achmadi', nama: 'Komplek Mbah Achmadi', peran: 'Pengelolaan kamar, kebersihan & ketertiban asrama' },
        { id: 'komplek_romlah', nama: 'Komplek Mbah Romlah', peran: 'Pengelolaan kamar, kebersihan & ketertiban asrama' },
        { id: 'komplek_wasirah', nama: 'Komplek Mbah Wasirah', peran: 'Pengelolaan kamar, kebersihan & ketertiban asrama' }
      ];

      const KOMPLEK_LIST = [
        'Komplek Mbah Zainuri',
        'Komplek Mbah Achmadi',
        'Komplek Mbah Romlah',
        'Komplek Mbah Wasirah'
      ];

      const PREDIKAT_NGAJI = ['Mumtaz', 'Jayyid Jiddan', 'Jayyid', 'Perlu Bimbingan'];

      const DATA_AWAL = {
        catatan: [
          {
            id: 'cat-1',
            bagianId: 'dewan_pengasuh',
            tanggal: '2026-11-18',
            judul: 'Penguatan Disiplin Ngaji Ba’da Maghrib & Subuh',
            isi: 'Setiap bagian memastikan absensi dan murojaah santri berjalan tertib serta menjaga adab di lingkungan pondok.',
            status: 'Selesai'
          },
          {
            id: 'cat-2',
            bagianId: 'dewan_pengawas',
            tanggal: '2026-11-18',
            judul: 'Cek Ketertiban Jam Malam Asrama',
            isi: 'Lampu kamar padam tepat waktu dan kegiatan belajar mandiri sudah berjalan di sebagian besar kamar.',
            status: 'Dipantau'
          },
          {
            id: 'cat-3',
            bagianId: 'komplek_zainuri',
            tanggal: '2026-11-19',
            judul: 'Piket Kebersihan & Penataan Almari',
            isi: 'Seluruh kamar melaksanakan piket pagi; perlu tambahan tempat jemuran di area belakang.',
            status: 'Tindak Lanjut'
          }
        ],
        santri: [
          {
            id: 's-1',
            komplek: 'Komplek Mbah Zainuri',
            namaLengkap: 'Ahmad Fauzi',
            kamar: 'A-01',
            pencapaianNgaji: 'Juz 30 lancar, mulai Juz 1 & Jurumiyah bab Kalam',
            predikat: 'Mumtaz',
            catatan: 'Rajin setoran pagi dan membantu teman sekamar.'
          },
          {
            id: 's-2',
            komplek: 'Komplek Mbah Achmadi',
            namaLengkap: 'Muhammad Rasyid',
            kamar: 'B-02',
            pencapaianNgaji: 'Al-Qur’an Juz 12 & kitab Safinah bab Thaharah',
            predikat: 'Jayyid Jiddan',
            catatan: 'Hafalan stabil, perlu peningkatan ketepatan tajwid mad.'
          },
          {
            id: 's-3',
            komplek: 'Komplek Mbah Romlah',
            namaLengkap: 'Nadia Rahmawati',
            kamar: 'C-01',
            pencapaianNgaji: 'Juz 29 & 28 selesai, setoran harian lancar',
            predikat: 'Mumtaz',
            catatan: 'Konsisten mengikuti murojaah sore.'
          },
          {
            id: 's-4',
            komplek: 'Komplek Mbah Wasirah',
            namaLengkap: 'Salma Azzahra',
            kamar: 'D-03',
            pencapaianNgaji: 'Iqro 6 lanjut Al-Qur’an Juz 2',
            predikat: 'Perlu Bimbingan',
            catatan: 'Pendampingan intensif pelafalan huruf dan harakat.'
          }
        ]
      };

      function muatData() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return DATA_AWAL;
          const parsed = JSON.parse(raw);
          return {
            catatan: Array.isArray(parsed.catatan) ? parsed.catatan : DATA_AWAL.catatan,
            santri: Array.isArray(parsed.santri) ? parsed.santri : DATA_AWAL.santri
          };
        } catch (_err) {
          return DATA_AWAL;
        }
      }

      function badgeStatus(status) {
        if (status === 'Selesai') return 'bg-emerald-100 text-emerald-800 border-emerald-200';
        if (status === 'Dipantau') return 'bg-langit-100 text-langit-800 border-langit-200';
        return 'bg-kitab-100 text-amber-900 border-kitab-300';
      }

      function badgePredikat(predikat) {
        if (predikat === 'Mumtaz') return 'bg-langit-600 text-white';
        if (predikat === 'Jayyid Jiddan') return 'bg-langit-100 text-langit-900 border border-langit-300';
        if (predikat === 'Jayyid') return 'bg-kitab-100 text-amber-900 border border-kitab-300';
        return 'bg-rose-100 text-rose-800 border border-rose-200';
      }

      function App() {
        const [data, setData] = useState(muatData);
        const [tab, setTab] = useState('bagian');

        // Filter & form catatan bagian
        const [filterBagian, setFilterBagian] = useState('semua');
        const [cariCatatan, setCariCatatan] = useState('');
        const [formCatatan, setFormCatatan] = useState({
          bagianId: BAGIAN_LIST[0].id,
          tanggal: new Date().toISOString().slice(0, 10),
          judul: '',
          isi: '',
          status: 'Dipantau'
        });

        // Filter & form santri per komplek
        const [komplekAktif, setKomplekAktif] = useState(KOMPLEK_LIST[0]);
        const [cariSantri, setCariSantri] = useState('');
        const [formSantri, setFormSantri] = useState({
          namaLengkap: '',
          kamar: '',
          pencapaianNgaji: '',
          predikat: 'Jayyid Jiddan',
          catatan: ''
        });

        useEffect(() => {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
          } catch (_err) {
            // Abaikan error penyimpanan penuh
          }
        }, [data]);

        const bagianMap = useMemo(() => {
          const map = {};
          BAGIAN_LIST.forEach((b) => { map[b.id] = b; });
          return map;
        }, []);

        const catatanTersaring = useMemo(() => {
          return data.catatan.filter((item) => {
            const cocokBagian = filterBagian === 'semua' || item.bagianId === filterBagian;
            const q = cariCatatan.trim().toLowerCase();
            const cocokTeks =
              !q ||
              item.judul.toLowerCase().includes(q) ||
              item.isi.toLowerCase().includes(q) ||
              (bagianMap[item.bagianId] && bagianMap[item.bagianId].nama.toLowerCase().includes(q));
            return cocokBagian && cocokTeks;
          });
        }, [data.catatan, filterBagian, cariCatatan, bagianMap]);

        const santriKomplek = useMemo(() => {
          const q = cariSantri.trim().toLowerCase();
          return data.santri.filter((s) => {
            if (s.komplek !== komplekAktif) return false;
            if (!q) return true;
            return (
              s.namaLengkap.toLowerCase().includes(q) ||
              s.pencapaianNgaji.toLowerCase().includes(q) ||
              s.catatan.toLowerCase().includes(q) ||
              s.kamar.toLowerCase().includes(q)
            );
          });
        }, [data.santri, komplekAktif, cariSantri]);

        function tambahCatatan(ev) {
          ev.preventDefault();
          if (!formCatatan.judul.trim() || !formCatatan.isi.trim()) return;
          const baru = {
            id: 'cat-' + Date.now(),
            bagianId: formCatatan.bagianId,
            tanggal: formCatatan.tanggal,
            judul: formCatatan.judul.trim(),
            isi: formCatatan.isi.trim(),
            status: formCatatan.status
          };
          setData((prev) => ({ ...prev, catatan: [baru, ...prev.catatan] }));
          setFormCatatan((prev) => ({ ...prev, judul: '', isi: '' }));
        }

        function ubahStatusCatatan(id, statusBaru) {
          setData((prev) => ({
            ...prev,
            catatan: prev.catatan.map((c) => (c.id === id ? { ...c, status: statusBaru } : c))
          }));
        }

        function hapusCatatan(id) {
          setData((prev) => ({
            ...prev,
            catatan: prev.catatan.filter((c) => c.id !== id)
          }));
        }

        function tambahSantri(ev) {
          ev.preventDefault();
          if (!formSantri.namaLengkap.trim() || !formSantri.pencapaianNgaji.trim()) return;
          const baru = {
            id: 's-' + Date.now(),
            komplek: komplekAktif,
            namaLengkap: formSantri.namaLengkap.trim(),
            kamar: formSantri.kamar.trim() || '-',
            pencapaianNgaji: formSantri.pencapaianNgaji.trim(),
            predikat: formSantri.predikat,
            catatan: formSantri.catatan.trim() || '-'
          };
          setData((prev) => ({ ...prev, santri: [...prev.santri, baru] }));
          setFormSantri({
            namaLengkap: '',
            kamar: '',
            pencapaianNgaji: '',
            predikat: 'Jayyid Jiddan',
            catatan: ''
          });
        }

        function hapusSantri(id) {
          setData((prev) => ({
            ...prev,
            santri: prev.santri.filter((s) => s.id !== id)
          }));
        }

        function unduhBackupJSON() {
          const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'nusimak-nurul-ulum-backup-' + new Date().toISOString().slice(0, 10) + '.json';
          a.click();
          URL.revokeObjectURL(url);
        }

        function imporBackupJSON(ev) {
          const file = ev.target.files && ev.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = function () {
            try {
              const parsed = JSON.parse(String(reader.result || '{}'));
              if (Array.isArray(parsed.catatan) && Array.isArray(parsed.santri)) {
                setData({ catatan: parsed.catatan, santri: parsed.santri });
              }
            } catch (_err) {
              // Abaikan file tidak valid
            }
          };
          reader.readAsText(file);
          ev.target.value = '';
        }

        return e(
          'div',
          { className: 'min-h-screen flex flex-col bg-slate-100 text-slate-900' },

          // Header
          e(
            'header',
            { className: 'bg-gradient-to-r from-langit-800 via-langit-700 to-langit-600 text-white border-b-4 border-kitab-400 shadow-sm' },
            e(
              'div',
              { className: 'max-w-6xl mx-auto px-4 py-5 flex flex-col md:flex-row md:items-center md:justify-between gap-4' },
              e(
                'div',
                null,
                e(
                  'div',
                  { className: 'inline-flex items-center gap-2 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-kitab-400 text-slate-900 mb-2' },
                  'PONDOK PESANTREN NURUL ULUM • BANTUL'
                ),
                e('h1', { className: 'text-2xl md:text-3xl font-bold tracking-tight' }, 'NUSIMAK'),
                e(
                  'p',
                  { className: 'text-sm text-langit-100 mt-0.5' },
                  'Nurul Ulum Sistem Monitoring Asrama & Kegiatan — Catatan 8 Bagian, Santri & Pencapaian Ngaji'
                )
              ),
              e(
                'div',
                { className: 'flex flex-wrap items-center gap-2 no-print' },
                e(
                  'button',
                  {
                    type: 'button',
                    onClick: unduhBackupJSON,
                    className: 'px-3 py-2 rounded-lg text-xs font-semibold bg-white/15 hover:bg-white/25 border border-white/25 transition'
                  },
                  'Ekspor JSON'
                ),
                e(
                  'label',
                  {
                    className: 'px-3 py-2 rounded-lg text-xs font-semibold bg-white/15 hover:bg-white/25 border border-white/25 transition cursor-pointer'
                  },
                  'Impor JSON',
                  e('input', { type: 'file', accept: 'application/json', onChange: imporBackupJSON, className: 'hidden' })
                ),
                e(
                  'button',
                  {
                    type: 'button',
                    onClick: function () { window.print(); },
                    className: 'px-3.5 py-2 rounded-lg text-xs font-bold bg-kitab-400 hover:bg-kitab-300 text-slate-900 transition'
                  },
                  'Cetak Rekap'
                )
              )
            )
          ),

          // Ringkasan Cepat
          e(
            'section',
            { className: 'max-w-6xl w-full mx-auto px-4 -mt-3 no-print' },
            e(
              'div',
              { className: 'grid grid-cols-2 md:grid-cols-4 gap-3' },
              [
                { label: 'Unsur / Bagian', val: String(BAGIAN_LIST.length), sub: 'Termasuk Dewan Pengasuh' },
                { label: 'Catatan Laporan', val: String(data.catatan.length), sub: 'Tersimpan di browser' },
                { label: 'Komplek Asrama', val: String(KOMPLEK_LIST.length), sub: 'Zainuri, Achmadi, Romlah, Wasirah' },
                { label: 'Total Data Santri', val: String(data.santri.length), sub: 'Nama & capaian ngaji' }
              ].map((stat, idx) =>
                e(
                  'div',
                  {
                    key: idx,
                    className: 'bg-white rounded-xl p-3.5 border border-slate-200 shadow-sm'
                  },
                  e('div', { className: 'text-xs font-medium text-slate-500' }, stat.label),
                  e('div', { className: 'text-2xl font-bold text-langit-800 mt-0.5' }, stat.val),
                  e('div', { className: 'text-[11px] text-slate-500 mt-0.5' }, stat.sub)
                )
              )
            )
          ),

          // Navigasi Tab
          e(
            'nav',
            { className: 'max-w-6xl w-full mx-auto px-4 mt-5 no-print' },
            e(
              'div',
              { className: 'inline-flex flex-wrap gap-2 bg-white p-1.5 rounded-xl border border-slate-200 shadow-sm' },
              [
                { id: 'bagian', label: '1. Skema & Catatan 8 Bagian' },
                { id: 'santri', label: '2. Santri & Ngaji per Komplek' },
                { id: 'rekap', label: '3. Rekapitulasi Terpadu' }
              ].map((t) =>
                e(
                  'button',
                  {
                    key: t.id,
                    type: 'button',
                    onClick: function () { setTab(t.id); },
                    className:
                      'px-4 py-2 rounded-lg text-sm font-semibold transition ' +
                      (tab === t.id
                        ? 'bg-langit-600 text-white shadow-sm'
                        : 'text-slate-700 hover:bg-langit-50')
                  },
                  t.label
                )
              )
            )
          ),

          // Konten Utama
          e(
            'main',
            { className: 'max-w-6xl w-full mx-auto px-4 py-6 flex-1 space-y-6' },

            // TAB 1: 8 BAGIAN
            tab === 'bagian' &&
              e(
                'div',
                { className: 'space-y-6' },

                // Skema 8 Bagian
                e(
                  'div',
                  { className: 'bg-white rounded-2xl border border-slate-200 p-5 shadow-sm' },
                  e(
                    'div',
                    { className: 'flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 mb-4' },
                    e(
                      'div',
                      null,
                      e('h2', { className: 'text-lg font-bold text-slate-900' }, 'Skema Struktur 8 Bagian Pengurus'),
                      e('p', { className: 'text-xs text-slate-600' }, 'Klik salah satu bagian untuk memfilter catatan laporannya.')
                    ),
                    e(
                      'button',
                      {
                        type: 'button',
                        onClick: function () { setFilterBagian('semua'); },
                        className: 'text-xs font-semibold text-langit-700 hover:underline self-start sm:self-auto'
                      },
                      'Tampilkan Semua (8 Bagian)'
                    )
                  ),
                  e(
                    'div',
                    { className: 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3' },
                    BAGIAN_LIST.map((b, i) => {
                      const aktif = filterBagian === b.id;
                      const isPengasuh = b.id === 'dewan_pengasuh';
                      return e(
                        'button',
                        {
                          key: b.id,
                          type: 'button',
                          onClick: function () { setFilterBagian(aktif ? 'semua' : b.id); },
                          className:
                            'text-left p-3.5 rounded-xl border transition ' +
                            (aktif
                              ? 'bg-langit-50 border-langit-600 ring-2 ring-langit-200'
                              : isPengasuh
                              ? 'bg-kitab-100/40 border-kitab-400 hover:bg-kitab-100/70'
                              : 'bg-slate-50/70 border-slate-200 hover:border-langit-300 hover:bg-langit-50/40')
                        },
                        e(
                          'div',
                          { className: 'flex items-center justify-between gap-2 mb-1' },
                          e(
                            'span',
                            {
                              className:
                                'text-[11px] font-bold px-2 py-0.5 rounded ' +
                                (isPengasuh ? 'bg-kitab-400 text-slate-900' : 'bg-langit-100 text-langit-800')
                            },
                            '0' + (i + 1)
                          ),
                          isPengasuh &&
                            e(
                              'span',
                              { className: 'text-[10px] font-semibold uppercase tracking-wide text-amber-900' },
                              'Pembina Utama'
                            )
                        ),
                        e('div', { className: 'font-bold text-sm text-slate-900' }, b.nama),
                        e('p', { className: 'text-xs text-slate-600 mt-1 leading-relaxed' }, b.peran)
                      );
                    })
                  )
                ),

                // Form & Daftar Catatan
                e(
                  'div',
                  { className: 'grid grid-cols-1 lg:grid-cols-12 gap-6' },

                  // Form Input Catatan
                  e(
                    'form',
                    {
                      onSubmit: tambahCatatan,
                      className: 'lg:col-span-4 bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-3.5 h-fit'
                    },
                    e('h3', { className: 'text-base font-bold text-slate-900' }, 'Tambah Catatan Bagian'),
                    e(
                      'div',
                      null,
                      e('label', { className: 'block text-xs font-semibold text-slate-700 mb-1' }, 'Bagian / Unsur'),
                      e(
                        'select',
                        {
                          value: formCatatan.bagianId,
                          onChange: function (ev) { setFormCatatan({ ...formCatatan, bagianId: ev.target.value }); },
                          className: 'w-full rounded-lg border border-slate-300 px-3 py-2 text-sm bg-white focus:outline-none focus:border-langit-600'
                        },
                        BAGIAN_LIST.map((b) => e('option', { key: b.id, value: b.id }, b.nama))
                      )
                    ),
                    e(
                      'div',
                      { className: 'grid grid-cols-2 gap-2.5' },
                      e(
                        'div',
                        null,
                        e('label', { className: 'block text-xs font-semibold text-slate-700 mb-1' }, 'Tanggal'),
                        e('input', {
                          type: 'date',
                          value: formCatatan.tanggal,
                          onChange: function (ev) { setFormCatatan({ ...formCatatan, tanggal: ev.target.value }); },
                          className: 'w-full rounded-lg border border-slate-300 px-2.5 py-2 text-sm focus:outline-none focus:border-langit-600'
                        })
                      ),
                      e(
                        'div',
                        null,
                        e('label', { className: 'block text-xs font-semibold text-slate-700 mb-1' }, 'Status'),
                        e(
                          'select',
                          {
                            value: formCatatan.status,
                            onChange: function (ev) { setFormCatatan({ ...formCatatan, status: ev.target.value }); },
                            className: 'w-full rounded-lg border border-slate-300 px-2.5 py-2 text-sm bg-white focus:outline-none focus:border-langit-600'
                          },
                          ['Dipantau', 'Tindak Lanjut', 'Selesai'].map((st) => e('option', { key: st, value: st }, st))
                        )
                      )
                    ),
                    e(
                      'div',
                      null,
                      e('label', { className: 'block text-xs font-semibold text-slate-700 mb-1' }, 'Judul Catatan'),
                      e('input', {
                        type: 'text',
                        required: true,
                        placeholder: 'Contoh: Evaluasi setoran ngaji malam',
                        value: formCatatan.judul,
                        onChange: function (ev) { setFormCatatan({ ...formCatatan, judul: ev.target.value }); },
                        className: 'w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:border-langit-600'
                      })
                    ),
                    e(
                      'div',
                      null,
                      e('label', { className: 'block text-xs font-semibold text-slate-700 mb-1' }, 'Isi Catatan / Arahan'),
                      e('textarea', {
                        rows: 3,
                        required: true,
                        placeholder: 'Tuliskan poin laporan, temuan, atau tindak lanjut...',
                        value: formCatatan.isi,
                        onChange: function (ev) { setFormCatatan({ ...formCatatan, isi: ev.target.value }); },
                        className: 'w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:border-langit-600'
                      })
                    ),
                    e(
                      'button',
                      {
                        type: 'submit',
                        className: 'w-full py-2.5 px-4 rounded-lg text-sm font-bold bg-langit-600 hover:bg-langit-700 text-white transition'
                      },
                      'Simpan Catatan'
                    )
                  ),

                  // Daftar Catatan
                  e(
                    'div',
                    { className: 'lg:col-span-8 bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-4' },
                    e(
                      'div',
                      { className: 'flex flex-col sm:flex-row sm:items-center justify-between gap-3' },
                      e(
                        'h3',
                        { className: 'text-base font-bold text-slate-900' },
                        'Daftar Catatan (' + catatanTersaring.length + ')'
                      ),
                      e('input', {
                        type: 'search',
                        placeholder: 'Cari judul, isi, atau nama bagian...',
                        value: cariCatatan,
                        onChange: function (ev) { setCariCatatan(ev.target.value); },
                        className: 'w-full sm:w-64 rounded-lg border border-slate-300 px-3 py-1.5 text-sm focus:outline-none focus:border-langit-600'
                      })
                    ),
                    catatanTersaring.length === 0
                      ? e(
                          'div',
                          { className: 'text-center py-10 text-sm text-slate-500 bg-slate-50 rounded-xl border border-dashed border-slate-300' },
                          'Belum ada catatan yang sesuai dengan filter.'
                        )
                      : e(
                          'div',
                          { className: 'space-y-3' },
                          catatanTersaring.map((item) => {
                            const b = bagianMap[item.bagianId] || { nama: 'Bagian' };
                            return e(
                              'div',
                              {
                                key: item.id,
                                className: 'p-4 rounded-xl border border-slate-200 bg-slate-50/50 hover:bg-white transition'
                              },
                              e(
                                'div',
                                { className: 'flex flex-wrap items-center justify-between gap-2 mb-1.5' },
                                e(
                                  'div',
                                  { className: 'flex flex-wrap items-center gap-2' },
                                  e(
                                    'span',
                                    { className: 'text-xs font-bold px-2.5 py-0.5 rounded-md bg-langit-100 text-langit-900' },
                                    b.nama
                                  ),
                                  e('span', { className: 'text-xs text-slate-500' }, item.tanggal)
                                ),
                                e(
                                  'div',
                                  { className: 'flex items-center gap-2' },
                                  e(
                                    'select',
                                    {
                                      value: item.status,
                                      onChange: function (ev) { ubahStatusCatatan(item.id, ev.target.value); },
                                      className: 'text-xs font-semibold rounded-md px-2 py-1 border ' + badgeStatus(item.status)
                                    },
                                    ['Dipantau', 'Tindak Lanjut', 'Selesai'].map((st) =>
                                      e('option', { key: st, value: st, className: 'bg-white text-slate-900' }, st)
                                    )
                                  ),
                                  e(
                                    'button',
                                    {
                                      type: 'button',
                                      onClick: function () { hapusCatatan(item.id); },
                                      className: 'text-xs font-semibold text-rose-600 hover:text-rose-800 px-1.5 py-1'
                                    },
                                    'Hapus'
                                  )
                                )
                              ),
                              e('h4', { className: 'font-bold text-slate-900 text-sm' }, item.judul),
                              e('p', { className: 'text-sm text-slate-700 mt-1 leading-relaxed' }, item.isi)
                            );
                          })
                        )
                  )
                )
              ),

            // TAB 2: SANTRI & NGAJI PER KOMPLEK
            tab === 'santri' &&
              e(
                'div',
                { className: 'space-y-5' },

                // Pilihan 4 Komplek
                e(
                  'div',
                  { className: 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3' },
                  KOMPLEK_LIST.map((komp) => {
                    const jumlah = data.santri.filter((s) => s.komplek === komp).length;
                    const aktif = komplekAktif === komp;
                    return e(
                      'button',
                      {
                        key: komp,
                        type: 'button',
                        onClick: function () { setKomplekAktif(komp); },
                        className:
                          'p-4 rounded-xl border text-left transition ' +
                          (aktif
                            ? 'bg-langit-700 text-white border-langit-700 shadow-sm'
                            : 'bg-white text-slate-900 border-slate-200 hover:border-langit-400')
                      },
                      e(
                        'div',
                        { className: 'flex items-center justify-between gap-2' },
                        e(
                          'span',
                          {
                            className:
                              'text-xs font-semibold px-2 py-0.5 rounded ' +
                              (aktif ? 'bg-kitab-400 text-slate-900' : 'bg-langit-50 text-langit-800')
                          },
                          jumlah + ' Santri'
                        )
                      ),
                      e('div', { className: 'font-bold text-sm mt-2' }, komp),
                      e(
                        'div',
                        { className: 'text-xs mt-0.5 ' + (aktif ? 'text-langit-100' : 'text-slate-500') },
                        'Klik untuk kelola nama & ngaji'
                      )
                    );
                  })
                ),

                e(
                  'div',
                  { className: 'grid grid-cols-1 lg:grid-cols-12 gap-6' },

                  // Form Tambah Santri
                  e(
                    'form',
                    {
                      onSubmit: tambahSantri,
                      className: 'lg:col-span-4 bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-3.5 h-fit'
                    },
                    e(
                      'div',
                      null,
                      e('span', { className: 'text-xs font-bold text-langit-700 uppercase' }, komplekAktif),
                      e('h3', { className: 'text-base font-bold text-slate-900' }, 'Tambah Data Santri')
                    ),
                    e(
                      'div',
                      null,
                      e('label', { className: 'block text-xs font-semibold text-slate-700 mb-1' }, 'Nama Lengkap Santri'),
                      e('input', {
                        type: 'text',
                        required: true,
                        placeholder: 'Contoh: Muhammad Rizky Pratama',
                        value: formSantri.namaLengkap,
                        onChange: function (ev) { setFormSantri({ ...formSantri, namaLengkap: ev.target.value }); },
                        className: 'w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:border-langit-600'
                      })
                    ),
                    e(
                      'div',
                      { className: 'grid grid-cols-2 gap-2.5' },
                      e(
                        'div',
                        null,
                        e('label', { className: 'block text-xs font-semibold text-slate-700 mb-1' }, 'Kamar'),
                        e('input', {
                          type: 'text',
                          placeholder: 'Contoh: A-04',
                          value: formSantri.kamar,
                          onChange: function (ev) { setFormSantri({ ...formSantri, kamar: ev.target.value }); },
                          className: 'w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:border-langit-600'
                        })
                      ),
                      e(
                        'div',
                        null,
                        e('label', { className: 'block text-xs font-semibold text-slate-700 mb-1' }, 'Predikat Ngaji'),
                        e(
                          'select',
                          {
                            value: formSantri.predikat,
                            onChange: function (ev) { setFormSantri({ ...formSantri, predikat: ev.target.value }); },
                            className: 'w-full rounded-lg border border-slate-300 px-2.5 py-2 text-sm bg-white focus:outline-none focus:border-langit-600'
                          },
                          PREDIKAT_NGAJI.map((p) => e('option', { key: p, value: p }, p))
                        )
                      )
                    ),
                    e(
                      'div',
                      null,
                      e('label', { className: 'block text-xs font-semibold text-slate-700 mb-1' }, 'Pencapaian Ngaji'),
                      e('input', {
                        type: 'text',
                        required: true,
                        placeholder: 'Contoh: Juz 15 lancar, mulai Tuhfatul Athfal',
                        value: formSantri.pencapaianNgaji,
                        onChange: function (ev) { setFormSantri({ ...formSantri, pencapaianNgaji: ev.target.value }); },
                        className: 'w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:border-langit-600'
                      })
                    ),
                    e(
                      'div',
                      null,
                      e('label', { className: 'block text-xs font-semibold text-slate-700 mb-1' }, 'Catatan Santri'),
                      e('textarea', {
                        rows: 3,
                        placeholder: 'Catatan perkembangan setoran, adab, atau pendampingan...',
                        value: formSantri.catatan,
                        onChange: function (ev) { setFormSantri({ ...formSantri, catatan: ev.target.value }); },
                        className: 'w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:border-langit-600'
                      })
                    ),
                    e(
                      'button',
                      {
                        type: 'submit',
                        className: 'w-full py-2.5 px-4 rounded-lg text-sm font-bold bg-langit-600 hover:bg-langit-700 text-white transition'
                      },
                      'Simpan Santri ke Komplek'
                    )
                  ),

                  // Daftar Santri Komplek Aktif
                  e(
                    'div',
                    { className: 'lg:col-span-8 bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-4' },
                    e(
                      'div',
                      { className: 'flex flex-col sm:flex-row sm:items-center justify-between gap-3' },
                      e(
                        'div',
                        null,
                        e('h3', { className: 'text-base font-bold text-slate-900' }, komplekAktif),
                        e(
                          'p',
                          { className: 'text-xs text-slate-500' },
                          'Menampilkan ' + santriKomplek.length + ' santri'
                        )
                      ),
                      e('input', {
                        type: 'search',
                        placeholder: 'Cari nama, ngaji, kamar, atau catatan...',
                        value: cariSantri,
                        onChange: function (ev) { setCariSantri(ev.target.value); },
                        className: 'w-full sm:w-64 rounded-lg border border-slate-300 px-3 py-1.5 text-sm focus:outline-none focus:border-langit-600'
                      })
                    ),
                    santriKomplek.length === 0
                      ? e(
                          'div',
                          { className: 'text-center py-10 text-sm text-slate-500 bg-slate-50 rounded-xl border border-dashed border-slate-300' },
                          'Belum ada data santri di komplek ini.'
                        )
                      : e(
                          'div',
                          { className: 'overflow-x-auto' },
                          e(
                            'table',
                            { className: 'w-full text-left border-collapse text-sm' },
                            e(
                              'thead',
                              null,
                              e(
                                'tr',
                                { className: 'border-b border-slate-200 text-xs uppercase text-slate-500 bg-slate-50' },
                                e('th', { className: 'py-2.5 px-3' }, 'No'),
                                e('th', { className: 'py-2.5 px-3' }, 'Nama Lengkap'),
                                e('th', { className: 'py-2.5 px-3' }, 'Pencapaian Ngaji'),
                                e('th', { className: 'py-2.5 px-3' }, 'Predikat'),
                                e('th', { className: 'py-2.5 px-3' }, 'Catatan'),
                                e('th', { className: 'py-2.5 px-3 text-right' }, 'Aksi')
                              )
                            ),
                            e(
                              'tbody',
                              { className: 'divide-y divide-slate-100' },
                              santriKomplek.map((s, idx) =>
                                e(
                                  'tr',
                                  { key: s.id, className: 'hover:bg-langit-50/40 align-top' },
                                  e('td', { className: 'py-3 px-3 text-slate-500 font-medium' }, String(idx + 1)),
                                  e(
                                    'td',
                                    { className: 'py-3 px-3' },
                                    e('div', { className: 'font-bold text-slate-900' }, s.namaLengkap),
                                    e('div', { className: 'text-xs text-slate-500' }, 'Kamar: ' + s.kamar)
                                  ),
                                  e('td', { className: 'py-3 px-3 text-slate-800' }, s.pencapaianNgaji),
                                  e(
                                    'td',
                                    { className: 'py-3 px-3 whitespace-nowrap' },
                                    e(
                                      'span',
                                      { className: 'text-xs font-semibold px-2.5 py-1 rounded-full ' + badgePredikat(s.predikat) },
                                      s.predikat
                                    )
                                  ),
                                  e('td', { className: 'py-3 px-3 text-slate-600' }, s.catatan),
                                  e(
                                    'td',
                                    { className: 'py-3 px-3 text-right' },
                                    e(
                                      'button',
                                      {
                                        type: 'button',
                                        onClick: function () { hapusSantri(s.id); },
                                        className: 'text-xs font-semibold text-rose-600 hover:text-rose-800'
                                      },
                                      'Hapus'
                                    )
                                  )
                                )
                              )
                            )
                          )
                        )
                  )
                )
              ),

            // TAB 3: REKAPITULASI TERPADU
            tab === 'rekap' &&
              e(
                'div',
                { className: 'space-y-6' },
                e(
                  'div',
                  { className: 'bg-white rounded-2xl border border-slate-200 p-5 shadow-sm print-break' },
                  e('h2', { className: 'text-lg font-bold text-slate-900 mb-1' }, 'Rekapitulasi Catatan 8 Bagian'),
                  e('p', { className: 'text-xs text-slate-500 mb-4' }, 'Pondok Pesantren Nurul Ulum Bantul'),
                  e(
                    'div',
                    { className: 'overflow-x-auto' },
                    e(
                      'table',
                      { className: 'w-full text-left border-collapse text-sm' },
                      e(
                        'thead',
                        null,
                        e(
                          'tr',
                          { className: 'border-b border-slate-200 bg-langit-50 text-xs uppercase text-langit-900' },
                          e('th', { className: 'py-2.5 px-3' }, 'Bagian'),
                          e('th', { className: 'py-2.5 px-3' }, 'Tanggal'),
                          e('th', { className: 'py-2.5 px-3' }, 'Judul & Catatan'),
                          e('th', { className: 'py-2.5 px-3' }, 'Status')
                        )
                      ),
                      e(
                        'tbody',
                        { className: 'divide-y divide-slate-100' },
                        data.catatan.map((c) => {
                          const b = bagianMap[c.bagianId] || { nama: 'Bagian' };
                          return e(
                            'tr',
                            { key: c.id, className: 'align-top' },
                            e('td', { className: 'py-2.5 px-3 font-semibold text-slate-900 whitespace-nowrap' }, b.nama),
                            e('td', { className: 'py-2.5 px-3 text-slate-600 whitespace-nowrap' }, c.tanggal),
                            e(
                              'td',
                              { className: 'py-2.5 px-3' },
                              e('div', { className: 'font-bold text-slate-900' }, c.judul),
                              e('div', { className: 'text-slate-700 text-xs mt-0.5' }, c.isi)
                            ),
                            e(
                              'td',
                              { className: 'py-2.5 px-3 whitespace-nowrap' },
                              e('span', { className: 'text-xs font-semibold px-2 py-0.5 rounded border ' + badgeStatus(c.status) }, c.status)
                            )
                          );
                        })
                      )
                    )
                  )
                ),

                e(
                  'div',
                  { className: 'bg-white rounded-2xl border border-slate-200 p-5 shadow-sm print-break' },
                  e('h2', { className: 'text-lg font-bold text-slate-900 mb-4' }, 'Rekapitulasi Santri & Pencapaian Ngaji per Komplek'),
                  e(
                    'div',
                    { className: 'space-y-5' },
                    KOMPLEK_LIST.map((komp) => {
                      const daftar = data.santri.filter((s) => s.komplek === komp);
                      return e(
                        'div',
                        { key: komp, className: 'border border-slate-200 rounded-xl p-4' },
                        e(
                          'div',
                          { className: 'flex items-center justify-between mb-2.5' },
                          e('h3', { className: 'font-bold text-sm text-langit-900' }, komp),
                          e('span', { className: 'text-xs font-semibold text-slate-500' }, daftar.length + ' santri')
                        ),
                        daftar.length === 0
                          ? e('p', { className: 'text-xs text-slate-500 italic' }, 'Belum ada santri tercatat.')
                          : e(
                              'ul',
                              { className: 'divide-y divide-slate-100 text-xs' },
                              daftar.map((s) =>
                                e(
                                  'li',
                                  { key: s.id, className: 'py-2 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-1' },
                                  e(
                                    'div',
                                    null,
                                    e('span', { className: 'font-bold text-slate-900' }, s.namaLengkap),
                                    e('span', { className: 'text-slate-500' }, ' (' + s.kamar + ') — '),
                                    e('span', { className: 'text-slate-800' }, s.pencapaianNgaji),
                                    e('span', { className: 'text-slate-500' }, ' • Catatan: ' + s.catatan)
                                  ),
                                  e(
                                    'span',
                                    { className: 'font-semibold px-2 py-0.5 rounded-full self-start sm:self-auto ' + badgePredikat(s.predikat) },
                                    s.predikat
                                  )
                                )
                              )
                            )
                      );
                    })
                  )
                )
              )
          ),

          // Footer
          e(
            'footer',
            { className: 'bg-white border-t border-slate-200 py-4 px-4 text-center text-xs text-slate-500 no-print' },
            'NUSIMAK • Pondok Pesantren Nurul Ulum Bantul • Data tersimpan lokal (localStorage)'
          )
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(e(App));
    })();
  </script>
</body>
</html>
