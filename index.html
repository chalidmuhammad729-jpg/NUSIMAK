<body class="bg-slate-50 text-slate-900 min-h-screen antialiased selection:bg-langit-100 selection:text-langit-900">
  <div id="root"></div>

  <script>
    (function () {
      const e = React.createElement;
      const { useState, useEffect, useMemo, useRef } = React;

      const STORAGE_KEY = 'nusimak_nurul_ulum_bantul_v2';

      const LAPISAN_SKEMA = [
        {
          kodeLapisan: 'LAPISAN 1',
          judul: 'Arahan & Pengawasan Utama',
          keterangan: 'Penentu kebijakan strategis, pembinaan ruhiyah, dan kontrol kepatuhan aturan pondok.',
          gridClass: 'grid-cols-1 md:grid-cols-2',
          anggota: [
            {
              id: 'dewan_pengasuh',

              utama: true
            },
            {
              id: 'dewan_pengawas',
              nomor: '02',

          ]
        },
        {
          kodeLapisan: 'LAPISAN 2',
          judul: 'Pendidikan & Penggerak Kegiatan',
          keterangan: 'Pelaksana kurikulum ngaji, bimbingan adab, dan penggerak ritme harian santri.',
          gridClass: 'grid-cols-1 md:grid-cols-2',
          anggota: [
            {
              id: 'ustadz_ustadzah',
              nomor: '03',
              nama: 'Ustadz & Ustadzah',
              peran: 'Pengajaran kitab & Al-Qur’an, monitoring setoran/pencapaian ngaji, serta pendampingan akademik.'
            },
            {
              id: 'osim',
              nomor: '04',
              nama: 'OSIM',
              peran: 'Penggerak disiplin harian, ketertiban kegiatan santri, kebersihan umum & program kesantrian.'
            }
          ]
        },
        {
          kodeLapisan: 'LAPISAN 3',
          judul: 'Operasional Asrama (4 Komplek)',
          keterangan: 'Unit pengelolaan kamar, ketertiban asrama, dan pemantauan langsung santri per komplek.',
          gridClass: 'grid-cols-1 sm:grid-cols-2 lg:grid-cols-4',
          anggota: [
            {
              id: 'komplek_zainuri',
              nomor: '05',
              nama: 'Komplek Mbah Zainuri',
              peran: 'Pengelolaan kamar, kebersihan, ketertiban & laporan santri Komplek Mbah Zainuri.',
              komplekTarget: 'Komplek Mbah Zainuri'
            },
            {
              id: 'komplek_achmadi',
              nomor: '06',
              nama: 'Komplek Mbah Achmadi',
              peran: 'Pengelolaan kamar, kebersihan, ketertiban & laporan santri Komplek Mbah Achmadi.',
              komplekTarget: 'Komplek Mbah Achmadi'
            },
            {
              id: 'komplek_romlah',
              nomor: '07',
              nama: 'Komplek Mbah Romlah',
              peran: 'Pengelolaan kamar, kebersihan, ketertiban & laporan santri Komplek Mbah Romlah.',
              komplekTarget: 'Komplek Mbah Romlah'
            },
            {
              id: 'komplek_wasirah',
              nomor: '08',
              nama: 'Komplek Mbah Wasirah',
              peran: 'Pengelolaan kamar, kebersihan, ketertiban & laporan santri Komplek Mbah Wasirah.',
              komplekTarget: 'Komplek Mbah Wasirah'
            }
          ]
        }
      ];

      const SEMUA_BAGIAN = LAPISAN_SKEMA.reduce(function (acc, lap) {
        return acc.concat(lap.anggota);
      }, []);

      const KOMPLEK_LIST = [
        'Komplek Mbah Zainuri',
        'Komplek Mbah Achmadi',
        'Komplek Mbah Romlah',
        'Komplek Mbah Wasirah'
      ];

      const PREDIKAT_LIST = ['Mumtaz', 'Jayyid Jiddan', 'Jayyid', 'Perlu Bimbingan'];
      const STATUS_LIST = ['Dipantau', 'Tindak Lanjut', 'Selesai'];

      const DEFAULT_STATE = {
        periodeAktif: 'Tahun Ajaran 2026/2027 — Semester Ganjil',
        logoUrl: '',
        catatan: [
          {
            id: 'cat-101',
            bagianId: 'dewan_pengasuh',
            tanggal: '2026-11-18',
            periode: 'Tahun Ajaran 2026/2027 — Semester Ganjil',
            judul: 'Penguatan Disiplin Ngaji Ba’da Maghrib & Subuh',
            isi: 'Seluruh koordinator komplek dan ustadz/ustadzah memastikan presensi setoran tepat waktu serta menjaga ketenangan area masjid dan asrama.',
            status: 'Selesai'
          },
          {
            id: 'cat-102',
            bagianId: 'dewan_pengawas',
            tanggal: '2026-11-19',
            periode: 'Tahun Ajaran 2026/2027 — Semester Ganjil',
            judul: 'Audit Ketertiban Jam Malam & Inventaris Kamar',
            isi: 'Sebagian besar kamar sudah mematuhi jam istirahat; perlu penertiban jadwal piket malam di dua kamar sayap timur.',
            status: 'Tindak Lanjut'
          },
          {
            id: 'cat-103',
            bagianId: 'ustadz_ustadzah',
            tanggal: '2026-11-19',
            periode: 'Tahun Ajaran 2026/2027 — Semester Ganjil',
            judul: 'Evaluasi Tajwid & Kelancaran Murojaah Santri Baru',
            isi: 'Santri kelas awal dijadwalkan pendampingan bacaan makhraj 20 menit sebelum setoran utama.',
            status: 'Dipantau'
          },
          {
            id: 'cat-104',
            bagianId: 'osim',
            tanggal: '2026-11-20',
            periode: 'Tahun Ajaran 2026/2027 — Semester Ganjil',
            judul: 'Koordinasi Ro’an Akbar Jumat Pagi',
            isi: 'Pembagian zona kebersihan halaman utama, drainase, dan area jemuran antar-komplek telah disusun.',
            status: 'Dipantau'
          }
        ],
        santri: [
          {
            id: 's-101',
            komplek: 'Komplek Mbah Zainuri',
            namaLengkap: 'Ahmad Fauzi',
            kamar: 'A-01',
            pencapaianNgaji: 'Al-Qur’an Juz 30 lancar, mulai Juz 1 & Kitab Jurumiyah bab Kalam',
            predikat: 'Mumtaz',
            catatan: 'Setoran harian konsisten dan aktif membimbing adik kamar.'
          },
          {
            id: 's-102',
            komplek: 'Komplek Mbah Achmadi',
            namaLengkap: 'Muhammad Rasyid',
            kamar: 'B-02',
            pencapaianNgaji: 'Al-Qur’an Juz 12 & Kitab Safinatun Najah bab Thaharah',
            predikat: 'Jayyid Jiddan',
            catatan: 'Hafalan kuat, perlu ketelitian panjang pendek mad saat setoran cepat.'
          },
          {
            id: 's-103',
            komplek: 'Komplek Mbah Romlah',
            namaLengkap: 'Nadia Rahmawati',
            kamar: 'C-01',
            pencapaianNgaji: 'Juz 29 & 28 selesai, lanjut Juz 27 & Nadhom Aqidatul Awam',
            predikat: 'Mumtaz',
            catatan: 'Disiplin mengikuti murojaah sore dan tertib administrasi kamar.'
          },
          {
            id: 's-104',
            komplek: 'Komplek Mbah Wasirah',
            namaLengkap: 'Salma Azzahra',
            kamar: 'D-03',
            pencapaianNgaji: 'Iqro 6 lanjut Al-Qur’an Juz 2 (fokus makhraj & kelancaran)',
            predikat: 'Perlu Bimbingan',
            catatan: 'Mendapat pendampingan khusus ba’da Ashar bersama ustadzah.'
          }
        ]
      };

      function loadInitialState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return DEFAULT_STATE;
          const parsed = JSON.parse(raw);
          return {
            periodeAktif: typeof parsed.periodeAktif === 'string' && parsed.periodeAktif.trim()
              ? parsed.periodeAktif
              : DEFAULT_STATE.periodeAktif,
            logoUrl: typeof parsed.logoUrl === 'string' ? parsed.logoUrl : '',
            catatan: Array.isArray(parsed.catatan) ? parsed.catatan : DEFAULT_STATE.catatan,
            santri: Array.isArray(parsed.santri) ? parsed.santri : DEFAULT_STATE.santri
          };
        } catch (_e) {
          return DEFAULT_STATE;
        }
      }

      function formatTanggalIndo(isoDate) {
        if (!isoDate) return '-';
        const parts = isoDate.split('-');
        if (parts.length !== 3) return isoDate;
        const bulan = [
          'Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun',
          'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'
        ];
        const idx = parseInt(parts[1], 10) - 1;
        return parts[2] + ' ' + (bulan[idx] || parts[1]) + ' ' + parts[0];
      }

      function statusBadgeClass(status) {
        if (status === 'Selesai') return 'bg-emerald-50 text-emerald-800 border-emerald-200';
        if (status === 'Tindak Lanjut') return 'bg-kitab-100 text-amber-900 border-kitab-400';
        return 'bg-langit-50 text-langit-800 border-langit-200';
      }

      function predikatBadgeClass(predikat) {
        if (predikat === 'Mumtaz') return 'bg-langit-700 text-white';
        if (predikat === 'Jayyid Jiddan') return 'bg-langit-100 text-langit-900 border border-langit-300';
        if (predikat === 'Jayyid') return 'bg-kitab-100 text-amber-900 border border-kitab-300';
        return 'bg-rose-100 text-rose-800 border border-rose-200';
      }

      function LogoBadge(props) {
        const logoUrl = props.logoUrl;
        const sizeClass = props.sizeClass || 'w-12 h-12';
        if (logoUrl) {
          return e('img', {
            src: logoUrl,
            alt: 'Logo Pondok Pesantren Nurul Ulum Bantul',
            className: sizeClass + ' rounded-xl object-contain bg-white p-1 border border-slate-200 shrink-0'
          });
        }
        return e(
          'div',
          {
            className:
              sizeClass +
              ' rounded-xl bg-gradient-to-br from-langit-600 to-langit-800 border-2 border-kitab-400 flex flex-col items-center justify-center text-white font-extrabold shrink-0 shadow-sm'
          },
          e('span', { className: 'text-sm leading-none tracking-tight text-kitab-300' }, 'NU'),
          e('span', { className: 'text-[8px] tracking-widest uppercase mt-0.5 text-white/90' }, 'BANTUL')
        );
      }

      function App() {
        const [state, setState] = useState(loadInitialState);
        const [activeTab, setActiveTab] = useState('bagian');
        const [savedIndicator, setSavedIndicator] = useState('Tersimpan otomatis di perangkat ini');
        const [showLogoModal, setShowLogoModal] = useState(false);
        const [logoUrlInput, setLogoUrlInput] = useState('');

        // Filter & Form Catatan (Tab 1)
        const [filterBagian, setFilterBagian] = useState('semua');
        const [filterStatus, setFilterStatus] = useState('semua');
        const [filterDariTanggal, setFilterDariTanggal] = useState('');
        const [filterSampaiTanggal, setFilterSampaiTanggal] = useState('');
        const [cariCatatan, setCariCatatan] = useState('');
        const [editingCatatanId, setEditingCatatanId] = useState(null);
        const [formCatatan, setFormCatatan] = useState({
          bagianId: SEMUA_BAGIAN[0].id,
          tanggal: new Date().toISOString().slice(0, 10),
          periode: state.periodeAktif,
          judul: '',
          isi: '',
          status: 'Dipantau'
        });

        // Filter & Form Santri (Tab 2)
        const [komplekAktif, setKomplekAktif] = useState(KOMPLEK_LIST[0]);
        const [cariSantri, setCariSantri] = useState('');
        const [filterPredikat, setFilterPredikat] = useState('semua');
        const [editingSantriId, setEditingSantriId] = useState(null);
        const [formSantri, setFormSantri] = useState({
          komplek: KOMPLEK_LIST[0],
          namaLengkap: '',
          kamar: '',
          pencapaianNgaji: '',
          predikat: 'Jayyid Jiddan',
          catatan: ''
        });

        // Filter Rekap (Tab 3)
        const [rekapHanyaPeriodeAktif, setRekapHanyaPeriodeAktif] = useState(false);
        const [rekapKomplekFilter, setRekapKomplekFilter] = useState('semua');

        const formCatatanRef = useRef(null);
        const formSantriRef = useRef(null);

        // Simpan ke localStorage otomatis
        useEffect(function () {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            setSavedIndicator('Tersimpan otomatis di perangkat ini');
          } catch (_err) {
            setSavedIndicator('Peringatan: Penyimpanan browser penuh (kurangi ukuran gambar logo)');
          }
        }, [state]);

        // Sinkron periode default pada form catatan baru
        useEffect(function () {
          if (!editingCatatanId) {
            setFormCatatan(function (prev) {
              return { ...prev, periode: state.periodeAktif };
            });
          }
        }, [state.periodeAktif, editingCatatanId]);

        // Sinkron komplek pada form santri baru saat pindah komplek
        useEffect(function () {
          if (!editingSantriId) {
            setFormSantri(function (prev) {
              return { ...prev, komplek: komplekAktif };
            });
          }
        }, [komplekAktif, editingSantriId]);

        // Peringatan beforeunload jika ada isian formulir belum tersimpan
        const hasUnsavedDraft =
          formCatatan.judul.trim() !== '' ||
          formCatatan.isi.trim() !== '' ||
          formSantri.namaLengkap.trim() !== '' ||
          formSantri.pencapaianNgaji.trim() !== '' ||
          formSantri.catatan.trim() !== '';

        useEffect(function () {
          function handleBeforeUnload(ev) {
            if (!hasUnsavedDraft) return;
            ev.preventDefault();
            ev.returnValue = '';
          }
          window.addEventListener('beforeunload', handleBeforeUnload);
          return function () {
            window.removeEventListener('beforeunload', handleBeforeUnload);
          };
        }, [hasUnsavedDraft]);

        const bagianMap = useMemo(function () {
          const map = {};
          SEMUA_BAGIAN.forEach(function (b) {
            map[b.id] = b;
          });
          return map;
        }, []);

        const jumlahCatatanPerBagian = useMemo(function () {
          const counts = {};
          SEMUA_BAGIAN.forEach(function (b) {
            counts[b.id] = 0;
          });
          state.catatan.forEach(function (c) {
            if (counts[c.bagianId] !== undefined) {
              counts[c.bagianId] += 1;
            }
          });
          return counts;
        }, [state.catatan]);

        const jumlahTindakLanjut = useMemo(function () {
          return state.catatan.filter(function (c) {
            return c.status === 'Tindak Lanjut';
          }).length;
        }, [state.catatan]);

        const jumlahPerluBimbingan = useMemo(function () {
          return state.santri.filter(function (s) {
            return s.predikat === 'Perlu Bimbingan';
          }).length;
        }, [state.santri]);

        const catatanTersaring = useMemo(function () {
          const q = cariCatatan.trim().toLowerCase();
          return state.catatan.filter(function (item) {
            if (filterBagian !== 'semua' && item.bagianId !== filterBagian) return false;
            if (filterStatus !== 'semua' && item.status !== filterStatus) return false;
            if (filterDariTanggal && item.tanggal < filterDariTanggal) return false;
            if (filterSampaiTanggal && item.tanggal > filterSampaiTanggal) return false;
            if (!q) return true;
            const namaBagian = bagianMap[item.bagianId] ? bagianMap[item.bagianId].nama.toLowerCase() : '';
            return (
              item.judul.toLowerCase().includes(q) ||
              item.isi.toLowerCase().includes(q) ||
              (item.periode && item.periode.toLowerCase().includes(q)) ||
              namaBagian.includes(q)
            );
          });
        }, [state.catatan, filterBagian, filterStatus, filterDariTanggal, filterSampaiTanggal, cariCatatan, bagianMap]);

        const santriTersaring = useMemo(function () {
          const q = cariSantri.trim().toLowerCase();
          return state.santri.filter(function (s) {
            if (s.komplek !== komplekAktif) return false;
            if (filterPredikat !== 'semua' && s.predikat !== filterPredikat) return false;
            if (!q) return true;
            return (
              s.namaLengkap.toLowerCase().includes(q) ||
              s.kamar.toLowerCase().includes(q) ||
              s.pencapaianNgaji.toLowerCase().includes(q) ||
              s.catatan.toLowerCase().includes(q)
            );
          });
        }, [state.santri, komplekAktif, filterPredikat, cariSantri]);

        // Handler Catatan
        function handleSimpanCatatan(ev) {
          ev.preventDefault();
          if (!formCatatan.judul.trim() || !formCatatan.isi.trim()) return;

          if (editingCatatanId) {
            setState(function (prev) {
              return {
                ...prev,
                catatan: prev.catatan.map(function (c) {
                  if (c.id !== editingCatatanId) return c;
                  return {
                    ...c,
                    bagianId: formCatatan.bagianId,
                    tanggal: formCatatan.tanggal,
                    periode: formCatatan.periode.trim() || prev.periodeAktif,
                    judul: formCatatan.judul.trim(),
                    isi: formCatatan.isi.trim(),
                    status: formCatatan.status
                  };
                })
              };
            });
            setEditingCatatanId(null);
          } else {
            const baru = {
              id: 'cat-' + Date.now(),
              bagianId: formCatatan.bagianId,
              tanggal: formCatatan.tanggal,
              periode: formCatatan.periode.trim() || state.periodeAktif,
              judul: formCatatan.judul.trim(),
              isi: formCatatan.isi.trim(),
              status: formCatatan.status
            };
            setState(function (prev) {
              return { ...prev, catatan: [baru, ...prev.catatan] };
            });
          }

          setFormCatatan({
            bagianId: filterBagian !== 'semua' ? filterBagian : SEMUA_BAGIAN[0].id,
            tanggal: new Date().toISOString().slice(0, 10),
            periode: state.periodeAktif,
            judul: '',
            isi: '',
            status: 'Dipantau'
          });
        }

        function mulaiEditCatatan(item) {
          setEditingCatatanId(item.id);
          setFormCatatan({
            bagianId: item.bagianId,
            tanggal: item.tanggal,
            periode: item.periode || state.periodeAktif,
            judul: item.judul,
            isi: item.isi,
            status: item.status
          });
          if (formCatatanRef.current) {
            formCatatanRef.current.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        }

        function batalEditCatatan() {
          setEditingCatatanId(null);
          setFormCatatan({
            bagianId: SEMUA_BAGIAN[0].id,
            tanggal: new Date().toISOString().slice(0, 10),
            periode: state.periodeAktif,
            judul: '',
            isi: '',
            status: 'Dipantau'
          });
        }

        function ubahStatusCepat(id, statusBaru) {
          setState(function (prev) {
            return {
              ...prev,
              catatan: prev.catatan.map(function (c) {
                return c.id === id ? { ...c, status: statusBaru } : c;
              })
            };
          });
        }

        function hapusCatatan(item) {
          if (!window.confirm('Hapus catatan "' + item.judul + '"? Tindakan ini tidak dapat dibatalkan.')) return;
          if (editingCatatanId === item.id) batalEditCatatan();
          setState(function (prev) {
            return {
              ...prev,
              catatan: prev.catatan.filter(function (c) {
                return c.id !== item.id;
              })
            };
          });
        }

        // Handler Santri
        function handleSimpanSantri(ev) {
          ev.preventDefault();
          if (!formSantri.namaLengkap.trim() || !formSantri.pencapaianNgaji.trim()) return;

          if (editingSantriId) {
            setState(function (prev) {
              return {
                ...prev,
                santri: prev.santri.map(function (s) {
                  if (s.id !== editingSantriId) return s;
                  return {
                    ...s,
                    komplek: formSantri.komplek,
                    namaLengkap: formSantri.namaLengkap.trim(),
                    kamar: formSantri.kamar.trim() || '-',
                    pencapaianNgaji: formSantri.pencapaianNgaji.trim(),
                    predikat: formSantri.predikat,
                    catatan: formSantri.catatan.trim() || '-'
                  };
                })
              };
            });
            setKomplekAktif(formSantri.komplek);
            setEditingSantriId(null);
          } else {
            const baru = {
              id: 's-' + Date.now(),
              komplek: formSantri.komplek,
              namaLengkap: formSantri.namaLengkap.trim(),
              kamar: formSantri.kamar.trim() || '-',
              pencapaianNgaji: formSantri.pencapaianNgaji.trim(),
              predikat: formSantri.predikat,
              catatan: formSantri.catatan.trim() || '-'
            };
            setState(function (prev) {
              return { ...prev, santri: [...prev.santri, baru] };
            });
            setKomplekAktif(formSantri.komplek);
          }

          setFormSantri({
            komplek: komplekAktif,
            namaLengkap: '',
            kamar: '',
            pencapaianNgaji: '',
            predikat: 'Jayyid Jiddan',
            catatan: ''
          });
        }

        function mulaiEditSantri(s) {
          setEditingSantriId(s.id);
          setFormSantri({
            komplek: s.komplek,
            namaLengkap: s.namaLengkap,
            kamar: s.kamar === '-' ? '' : s.kamar,

          const reader = new FileReader();
          reader.onload = function () {

            setState(function (prev) {
              return { ...prev, logoUrl: result };

            setShowLogoModal(false);
          };
          reader.readAsDataURL(file);
          ev.target.value = '';

        // Ekspor CSV (Santri & Pencapaian Ngaji)
        function handleExportCSV() {
          const headers = ['No', 'Komplek', 'Nama Lengkap Santri', 'Kamar', 'Pencapaian Ngaji', 'Predikat', 'Catatan Pembinaan'];
          const rows = state.santri.map(function (s, idx) {
            return [
              idx + 1,
              s.komplek,
              s.namaLengkap,
              s.kamar,
              s.pencapaianNgaji,
              s.predikat,
              s.catatan
            ].map(function (val) {
              const str = String(val || '').replace(/"/g, '""');
              return '"' + str + '"';
            }).join(',');
          });
          const csvContent = '\uFEFF' + [headers.join(',')].concat(rows).join('\n');
          const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'NUSIMAK-Santri-Ngaji-' + new Date().toISOString().slice(0, 10) + '.csv';
          a.click();
          URL.revokeObjectURL(url);
        }

            dieksportPada: new Date().toISOString(),
            ...state
          };
          const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'NUSIMAK-Backup-' + new Date().toISOString().slice(0, 10) + '.json';
          a.click();
          URL.revokeObjectURL(url);
        }

        // Impor JSON
        function handleImportJSON(ev) {
          const file = ev.target.files && ev.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = function () {
            try {
              const parsed = JSON.parse(String(reader.result || '{}'));
              if (!Array.isArray(parsed.catatan) || !Array.isArray(parsed.santri)) {
                window.alert('Format file JSON tidak sesuai dengan struktur NUSIMAK.');
                return;
              }
              setState({
                periodeAktif: typeof parsed.periodeAktif === 'string' && parsed.periodeAktif.trim()
                  ? parsed.periodeAktif
                  : state.periodeAktif,
                logoUrl: typeof parsed.logoUrl === 'string' ? parsed.logoUrl : state.logoUrl,
                catatan: parsed.catatan,
                santri: parsed.santri
              });
              window.alert('Data backup NUSIMAK berhasil dipulihkan.');
            } catch (_err) {
              window.alert('Gagal membaca file JSON. Pastikan file tidak rusak.');
            }
          };
          reader.readAsText(file);
          ev.target.value = '';
        }
